name: Generate USC MDP calendar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python generate_mdp_calendar.py
      - name: Commit calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendario-mdp-usc-2026-2027.ics
          git diff --cached --quiet || git commit -m 'Generate full USC MDP calendar'
          git push
