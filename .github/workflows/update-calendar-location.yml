name: Update USC calendar locations

on:
  push:

permissions:
  contents: write

jobs:
  update-location:
    if: ${{ !contains(github.event.head_commit.message, 'Update USC calendar locations') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add classroom to LOCATION
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('calendario-mdp-usc-lugo-2026-2027.ics')
          s=p.read_text(encoding='utf-8')
          def fix(m):
              block=m.group(1)
              if re.search(r'^LOCATION:USC - Campus de Lugo - ', block, re.M):
                  return 'BEGIN:VEVENT\n'+block+'\nEND:VEVENT'
              aula=re.search(r'^DESCRIPTION:.*?Aula académica: ([^\\r\\n]+)', block, re.M)
              if not aula:
                  return 'BEGIN:VEVENT\n'+block+'\nEND:VEVENT'
              block=re.sub(r'^LOCATION:USC - Campus de Lugo.*$', 'LOCATION:USC - Campus de Lugo - '+aula.group(1), block, flags=re.M)
              return 'BEGIN:VEVENT\n'+block+'\nEND:VEVENT'
          s=re.sub(r'BEGIN:VEVENT\n(.*?)\nEND:VEVENT', fix, s, flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendario-mdp-usc-lugo-2026-2027.ics
          git diff --cached --quiet || git commit -m 'Update USC calendar locations'
          git push
