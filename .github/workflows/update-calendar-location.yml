name: Create USC calendar with classrooms

on:
  push:

permissions:
  contents: write

jobs:
  create-classroom-feed:
    if: ${{ !contains(github.event.head_commit.message, 'Create USC calendar with classrooms') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create classroom feed
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('calendario-mdp-usc-lugo-2026-2027.ics')
          dst=Path('calendario-mdp-usc-lugo-2026-2027-aulas.ics')
          s=src.read_text(encoding='utf-8')
          def fix(m):
              block=m.group(1)
              aula=re.search(r'Aula académica: ([^\\r\\n]+)', block)
              if aula:
                  block=re.sub(r'^LOCATION:.*$', 'LOCATION:USC - Campus de Lugo - '+aula.group(1), block, flags=re.M)
              return 'BEGIN:VEVENT\n'+block+'\nEND:VEVENT'
          s=re.sub(r'BEGIN:VEVENT\n(.*?)\nEND:VEVENT', fix, s, flags=re.S)
          dst.write_text(s,encoding='utf-8')
          PY
      - name: Commit classroom feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendario-mdp-usc-lugo-2026-2027-aulas.ics
          git diff --cached --quiet || git commit -m 'Create USC calendar with classrooms'
          git push
